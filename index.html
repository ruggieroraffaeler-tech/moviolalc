/* Analisi completa del video, frame per frame */
async function analyzePose(docKey, { onProgress, signal } = {}) {
  const doc = docOf(docKey), rt = rtOf(docKey);
  if (!rt.ready) throw new Error('Carica prima il video.');
  Pose.busy = true;
  try {
    await poseEnsure(doc.pose.model);
    await poseSetMode('VIDEO');
    const N = frameCount(doc);
    const data = new Float32Array(N * 132).fill(NaN);
    let ts = Math.max(Pose.lastTs, performance.now()) + 1000;
    let found = 0, done = 0;
    rt.pause();
    for (let f = 0; f < N; f++) {
      if (signal?.aborted) break;
      await rt.seekTo(timeOfFrame(doc, f));
      const { canvas, roi } = poseInput(docKey);
      ts += Math.max(1, Math.round(1000 / doc.fps));
      let res;
      try { res = Pose.lm.detectForVideo(canvas, ts); }
      catch (e) {
        console.warn(e);
        if (await poseFallbackCPU()) { ts += 1000; res = Pose.lm.detectForVideo(canvas, ts); } else throw e;
      }
      if (writeLandmarks(data, f, res, roi)) found++;
      done = f + 1;
      onProgress?.(done / N, found);
      if (f % 8 === 7) await nextFrame();
    }
    Pose.lastTs = ts;
    const final = doc.pose.smooth ? smoothPoseData(data, N) : data;
    setPoseData(docKey, final, N, doc.fps, doc.pose.model);
    try { await dbPut('pose', `${app.project.id}:${docKey}`, { fps: doc.fps, n: N, model: doc.pose.model, roi: doc.pose.roi, data: final }); }
    catch (e) { toast(storageErrorText(e), { type: 'error' }); }
    return { frames: done, found, total: N, aborted: !!signal?.aborted };
  } finally {
    Pose.busy = false;
  }
}

/* Rilevamento sul solo frame corrente (quando il video non è stato analizzato) */
async function detectCurrentFrame(docKey) {
  const doc = docOf(docKey), rt = rtOf(docKey);
  if (!rt.ready || Pose.busy || rt.playing) return false;
  Pose.busy = true;
  try {
    await poseEnsure(doc.pose.model);
    await poseSetMode('IMAGE');
    const f = frameOf(doc, rt.video.currentTime);
    const N = frameCount(doc);
    if (!rt.pose || rt.poseN !== N || Math.abs(rt.poseFps - doc.fps) > 0.01) {
      rt.pose = new Float32Array(N * 132).fill(NaN); rt.poseN = N; rt.poseFps = doc.fps; rt.poseModel = doc.pose.model;
    }
    const { canvas, roi } = poseInput(docKey);
    let res;
    try { res = Pose.lm.detect(canvas); }
    catch (e) { if (await poseFallbackCPU()) { await poseSetMode('IMAGE'); res = Pose.lm.detect(canvas); } else throw e; }
    const ok = writeLandmarks(rt.pose, f, res, roi);
    if (ok && !rt.autoSide) rt.autoSide = computeAutoSide(rt.pose, rt.poseN);

    Pose.busy = false;
  }
}
const savePoseSoon = debounce(async docKey => {
  const rt = rtOf(docKey), doc = docOf(docKey);
  if (!rt.pose) return;
  try { await dbPut('pose', `${app.project.id}:${docKey}`, { fps: rt.poseFps, n: rt.poseN, model: rt.poseModel, roi: doc.pose.roi, data: rt.pose }); } catch { /* */ }
}, 1500);

/* Landmark (normalizzati) di un frame, oppure null */
function poseLandmarksAtFrame(docKey, t) {
  const rt = rtOf(docKey);
  const p = poseAt(rt, t);
  if (!p) return null;
  const out = [];
  for (let i = 0; i < 33; i++) out.push([p.data[p.base + i * 4], p.data[p.base + i * 4 + 1], p.data[p.base + i * 4 + 3]]);
  return out;
}

/* Angoli di un frame (per diapositive e confronto) */
function anglesAt(docKey, kf) {
  const doc = docOf(docKey), rt = rtOf(docKey);
  const vw = rt.width || doc.video?.width || 1, vh = rt.height || doc.video?.height || 1;
  let P = null, side = null;
  const sk = kf?.shapes?.find(s => s.type === 'skeleton');
  if (sk) {
    P = i => (sk.lm[i] ? [sk.lm[i][0] * vw, sk.lm[i][1] * vh] : null);
    side = sk.side || 'L';
  } else {
    const p = poseAt(rt, kf ? kf.t : rt.video.currentTime);
    if (!p) return null;
    P = i => { const b = p.base + i * 4; return Number.isFinite(p.data[b]) ? [p.data[b] * vw, p.data[b + 1] * vh] : null; };

  for (const k of ANGLE_ORDER) { const a = computeAngle(k, P, side); if (Number.isFinite(a)) out[k] = a; }

/* ---------- Segnali per fasi e riconoscimento ---------- */

    if (!Number.isFinite(D[b])) continue;
    sig.valid++;
    const y = i => D[b + i * 4 + 1] * vh;
    sig.wristY[f] = (y(15) + y(16)) / 2;
    sig.hipY[f] = (y(23) + y(24)) / 2;
    sig.kneeY[f] = (y(25) + y(26)) / 2;
    sig.shY[f] = (y(11) + y(12)) / 2;

function fillGaps(a) {

const argMax = (a, f, t) => argBest(a, f, t, (x, y) => x > y);
const argMin = (a, f, t) => argBest(a, f, t, (x, y) => x < y);

/* Riconoscimento dell'alzata (euristico, da confermare) */
function recognizeLift(sig) {
  if (!sig) return null;
  const { N, fps, wristY, hipY, shY, noseY, torso, H } = sig;
  const k = Math.max(3, Math.round(N * 0.08));
  const st = a => median(Array.from(a.slice(0, k)));
  const w0 = st(wristY), sh0 = st(shY), hip0 = st(hipY), nose0 = st(noseY);
  const iTop = argMin(wristY, 0, N - 1);
  const wTop = wristY[iTop];
  if (median(Array.from(torso)) > 60) return { id: 'bench', why: 'busto orizzontale per tutto il video' };
  const overhead = wTop < nose0 - 0.04 * H;
  const reachShoulder = wTop < sh0 + 0.1 * H;
  const hipDrop = (Math.max(...hipY) - hip0) / H;
  if (w0 > hip0 - 0.06 * H) {
    if (overhead) {
      const fSh = firstIdx(0, N - 1, i => wristY[i] < sh0 + 0.08 * H);
      const fOv = firstIdx(0, N - 1, i => wristY[i] < noseY[i] - 0.04 * H);
      if (fSh >= 0 && fOv >= 0 && (fOv - fSh) / fps > 0.9) return { id: 'clean', why: 'il bilanciere si ferma alle spalle prima di andare sopra la testa (girata e slancio)' };
      return { id: 'snatch', why: 'il bilanciere va da terra sopra la testa in un solo movimento' };
    }
    if (reachShoulder) return { id: 'clean', why: 'il bilanciere va da terra alle spalle' };
    return { id: 'deadlift', why: 'il bilanciere sale fino alle anche' };
  }
  if (Math.abs(w0 - sh0) < 0.16 * H) {
    if (overhead) return { id: 'jerk', why: 'il bilanciere parte dalle spalle e va sopra la testa' };
    if (hipDrop > 0.12) return { id: 'squat', why: 'il bilanciere resta sulle spalle e le anche scendono' };
  }
  return null;
}

/* Fasi: restituisce { chiave evento: frame } */
function detectPhaseEvents(sig, family) {
  const ev = {};
  if (!sig || !family) return ev;
  const { N, fps, wristY, hipY, kneeY, shY, noseY, hipAng, kneeAng, H } = sig;
  const last = N - 1;
  const k = Math.max(3, Math.round(N * 0.06));
  const w0 = median(Array.from(wristY.slice(0, k)));
  const hipStand = percentile(Array.from(hipY), 0.1);
  if (family === 'pull' || family === 'deadlift') {
    const fUp = firstIdx(1, last, i => wristY[i] < w0 - 0.04 * H && (i + 2 > last || (wristY[i + 1] < w0 - 0.04 * H && wristY[i + 2] < w0 - 0.04 * H)));
    if (fUp < 0) return ev;
    let s = fUp;
    while (s > 0 && wristY[s - 1] - wristY[s] > 0.0025 * H) s--;
    ev.start = Math.max(0, s - 1);
    const kn = firstIdx(ev.start + 1, last, i => wristY[i] <= kneeY[i]);
    if (kn < 0) return ev;
    ev.knee = kn;
    const fTop = argMin(wristY, kn, last);
    if (family === 'deadlift') {
      ev.lockout = argMax(hipAng, kn, fTop >= kn ? fTop : last);
      const back = firstIdx(ev.lockout + 1, last, i => wristY[i] >= w0 - 0.03 * H);
      ev.end = back >= 0 ? back : last;
      return ev;
    }
    // ricezione: anche più basse nei 2,5 s dopo il passaggio al ginocchio
    const win = Math.min(last, kn + Math.round(2.5 * fps));
    let ct = argMax(hipY, kn + 1, win);
    const hipHigh = Math.min(...Array.from(hipY.slice(kn, Math.max(kn + 1, ct + 1))));
    const deep = ct > kn && hipY[ct] - hipHigh > 0.06 * H;
    const sum = Array.from(hipAng, (v, i) => v + kneeAng[i]);
    const extEnd = deep ? ct : Math.max(kn + 1, Math.min(win, fTop));
    ev.ext = argMax(sum, kn, extEnd);
    if (ev.ext - kn >= 2) {
      const sc = argMin(kneeAng, kn, ev.ext);
      if (sc > kn && sc < ev.ext) ev.scoop = sc;
    }
    if (!deep) {
      // ricezione alta (power): piccolo abbassamento dopo l'estensione
      const c2 = argMax(hipY, ev.ext + 1, Math.min(last, ev.ext + Math.round(1.2 * fps)));
      ct = c2 > ev.ext && hipY[c2] - hipY[ev.ext] > 0.02 * H ? c2 : -1;
    }
    if (ct > ev.ext) {
      ev.catch = ct;
      const tr = firstIdx(ev.ext + 1, ct - 1, i => wristY[i] < shY[i]);
      if (tr > ev.ext) ev.turnover = tr;
      else if (ct - ev.ext >= 3) ev.turnover = Math.round((ev.ext + ct) / 2);
      const standAfter = percentile(Array.from(hipY.slice(ct)), 0.1);
      const rec = firstIdx(ct + 1, last, i => hipY[i] <= standAfter + 0.03 * H);
      if (rec > ct) ev.recovery = rec;
    }
    return ev;
  }
  if (family === 'jerk') {
    const fOv = firstIdx(0, last, i => wristY[i] < noseY[i] - 0.04 * H);
    const lim = fOv > 0 ? fOv : last;
    const dip = argMax(hipY, 0, lim);
    if (dip < 0) return ev;
    const s = (() => { let i = dip; while (i > 0 && hipY[i - 1] < hipY[i] - 0.0015 * H) i--; return i; })();
    ev.start = Math.max(0, s - 2);
    ev.dip = dip;
    const drive = argMax(kneeAng, dip, Math.min(last, lim + Math.round(0.2 * fps)));
    if (drive > dip) ev.drive = drive;
    const from = (ev.drive || dip) + 1;
    const ct = argMax(hipY, from, Math.min(last, from + Math.round(1.6 * fps)));
    if (ct > from && hipY[ct] > hipStand + 0.05 * H) {
      ev.catch = ct;
      const rec = firstIdx(ct + 1, last, i => hipY[i] <= hipStand + 0.03 * H);
      if (rec > ct) ev.recovery = rec;
    }
    return ev;
  }
  if (family === 'squat' || family === 'bench') {
    const y = family === 'squat' ? hipY : wristY;
    const bottom = argMax(y, 0, last);
    const top = family === 'squat' ? hipStand : percentile(Array.from(wristY), 0.1);
    const near = i => y[i] <= top + 0.035 * H;
    let s = bottom; while (s > 0 && !near(s)) s--;
    let e = bottom; while (e < last && !near(e)) e++;
    ev.start = s; ev.bottom = bottom;
    if (bottom - s >= 2) ev.descent = Math.round((s + bottom) / 2);
    if (e > bottom) {
      if (family === 'squat') { ev.end = e; if (e - bottom >= 2) ev.ascent = Math.round((bottom + e) / 2); }
      else ev.lockout = e;
    }
    return ev;
  }
  return ev;
}

/* Crea i punti chiave suggeriti per le fasi della scheda */
function suggestKeyframes(docKey) {
  const doc = docOf(docKey), rt = rtOf(docKey);
  const sig = poseSignals(docKey);
  if (!sig) { toast('Prima analizza il movimento (pannello Corpo).', { type: 'error' }); return 0; }
  const tpl = currentTemplate();
  const fam = liftFamily(tpl);
  if (!fam) { toast('Questa scheda non ha fasi riconoscibili in automatico: aggiungi i punti chiave a mano.', { type: 'error' }); return 0; }
  const ev = detectPhaseEvents(sig, fam);
  pushUndo();
  let created = 0, lastF = -1;
  for (const ph of tpl.phases) {
    if (!ph.key || ev[ph.key] == null) continue;
    const pf = ev[ph.key];
    if (pf <= lastF) continue;
    lastF = pf;
    if (doc.keyframes.some(k => k.phaseId === ph.id)) continue;
    const t = (pf + 0.25) / rt.poseFps;
    const f = frameOf(doc, t);

/* Inseguimento automatico dal frame di partenza fino alla fine (o allo stop) */
async function trackBar(docKey, startF, nx, ny, r, { onProgress, onPoint, signal } = {}) {
  const doc = docOf(docKey), rt = rtOf(docKey);

  const ww = Math.max(16, Math.round(vw * k)), wh = Math.max(16, Math.round(vh * k));

  let cx = clamp(Math.round(nx * ww), half, ww - 1 - half), cy = clamp(Math.round(ny * wh), half, wh - 1 - half);
  // ricentra sul disco se il tocco non è preciso (piccola ricerca sulla simmetria non serve: si usa il punto toccato)
  const T0raw = patchAt(g, ww, cx, cy, M);
  let T = normalizeTemplate(T0raw);

    let best = searchBest(g, ww, wh, prx, pry, baseS + Math.hypot(vx, vy) * 0.5, M, T, half);
    if (!best || best.score < 0.5) {

      if (wide && (!best || wide.score > best.score)) best = wide;

    vx = vx * 0.3 + nvx * 0.7; vy = vy * 0.3 + nvy * 0.7;
    px = best.sx; py = best.sy;
    const cur = patchAt(g, ww, best.x, best.y, M);
    const mix = new Float32Array(cur.length);
    for (let i = 0; i < mix.length; i++) mix[i] = T0raw[i] * 0.6 + cur[i] * 0.4;
    T = normalizeTemplate(mix);
    const p = { f, x: px / ww, y: py / wh, c: +best.score.toFixed(3) };
    pts.push(p);
    onPoint?.(p);
    onProgress?.((f - startF) / Math.max(1, N - 1 - startF));

}

/* Statistiche (stime): altezza, spostamenti orizzontali, velocità verticale */
function barStats(docKey) {
  const doc = docOf(docKey), rt = rtOf(docKey);
  const pts = doc.bar.points;
  if (pts.length < 3) return null;
  const vw = rt.width || doc.video?.width, vh = rt.height || doc.video?.height;
  if (!vw || !vh) return null;
  const pxPerCm = (2 * doc.bar.r * vh) / (doc.bar.plateCm || 45);
  const X = pts.map(p => p.x * vw), Y = pts.map(p => p.y * vh);
  const sY = Y.map((_, i) => (Y[Math.max(0, i - 1)] + 2 * Y[i] + Y[Math.min(Y.length - 1, i + 1)]) / 4);
  const x0 = X[0], y0 = Y[0];
  let maxH = 0, iTop = 0;
  for (let i = 0; i < Y.length; i++) { const hh = (y0 - Y[i]) / pxPerCm; if (hh > maxH) { maxH = hh; iTop = i; } }

  let facing = 0;
  const lm = poseLandmarksAtFrame(docKey, timeOfFrame(doc, pts[0].f));
  if (lm) {
    const side = rt.autoSide === 'R' ? SIDE_IDX.R : SIDE_IDX.L;
    const toe = lm[side.ft], heel = lm[side.he];
    if (toe && heel && Number.isFinite(toe[0]) && Number.isFinite(heel[0])) facing = toe[0] >= heel[0] ? 1 : -1;
  }
  let fwd = 0, back = 0, right = 0, left = 0;
  for (let i = 0; i <= iTop; i++) {
    const dx = (X[i] - x0) / pxPerCm;
    right = Math.max(right, dx); left = Math.max(left, -dx);
  }
  if (facing) { fwd = facing > 0 ? right : left; back = facing > 0 ? left : right; }
  let vmax = 0;
  for (let i = 1; i < sY.length - 1; i++) {
    const df = pts[i + 1].f - pts[i - 1].f;
    if (df <= 0) continue;
    const vcm = -(sY[i + 1] - sY[i - 1]) / pxPerCm / (df / doc.fps);
    if (vcm > vmax && i <= iTop + 1) vmax = vcm;
  }
  return { maxH, facing, fwd, back, right, left, vmax: vmax / 100, frames: pts[pts.length - 1].f - pts[0].f + 1 };
}

function startDraw(tool, pt) {

    case 'pen':

      break;
    case 'vline': case 'hline': d.pts[0] = n; break;
    case 'angle':
      if (g.first && g.moved) { if (d.pts.length < 2) d.pts.push(n); else d.pts[1] = n; }

}
function endDraw(g, pt) {
  const d = Editor.draft;

  const minPx = 8 * Editor.dpr;
  switch (d.type) {
    case 'line': case 'arrow':
      if (dist(pt, g.start) < minPx) { Editor.draft = null; return; }
      commitShape(d); break;
    case 'circle':
      if (dist(pt, g.start) < minPx) { Editor.draft = null; return; }
      commitShape(d); break;
    case 'pen':
      d.pts = rdp(d.pts, 0.0012);
      commitShape(d); break;
    case 'vline': case 'hline':
      commitShape(d); break;
    case 'angle':
      if (d.pts.length >= 3) { d.pts = d.pts.slice(0, 3); delete d._hover; commitShape(d); }
      else {
        if (IS_TOUCH === false) { d.pts.push(toNorm(pt)); d._hover = true; }
        updateStageHint();

}

function startPinch() {

function movePinch() {

  const [a, b] = ps;

  const m = [(a.x + b.x) / 2, (a.y + b.y) / 2];
  const nx = (g.m0[0] - g.rect0.x) / g.rect0.w, ny = (g.m0[1] - g.rect0.y) / g.rect0.h;
  setZoom(clamp(g.z0 * d / g.d0, 1, 8), m, [nx, ny]);

function setZoom(z, screenPt, normPt) {
  const rt = rtOf(Editor.docKey);

  const w = base.w * z, hh = base.h * z;

  rt.view.panX = screenPt[0] - (Editor.W - w) / 2 - normPt[0] * w;

  setZoom(clamp(rt.view.zoom * factor, 1, 8), pt, [(pt[0] - r.x) / r.w, (pt[1] - r.y) / r.h]);

function clampPan(rt) {

  const base = fitRect(rt.width, rt.height, Editor.W, Editor.H, null, editorPad());
  const w = base.w * rt.view.zoom, hh = base.h * rt.view.zoom;

/* ---------- Riproduzione ---------- */
function seekFrame(key, f) {
  const doc = docOf(key), rt = rtOf(key);

  f = clamp(Math.round(f), 0, frameCount(doc) - 1);
  Editor.reqFrame[key] = f;
  if (rt.playing) rt.pause();
  invalidate();
  updateTransportState();
  return rt.seekTo(timeOfFrame(doc, f)).then(() => {
    if (Editor.reqFrame[key] === f && !rt._seeking) Editor.reqFrame[key] = null;
    doc.lastT = rt.video.currentTime;
    invalidate();
    emit('frame', { key });
  });
}
function stepFrame(delta) { const key = Editor.docKey; if (key) seekFrame(key, curFrame(key) + delta); }
function jumpKeyframe(dir) {
  const key = Editor.docKey, doc = docOf(key);
  const f = curFrame(key);
  const frames = doc.keyframes.map(k => frameOf(doc, k.t)).sort((a, b) => a - b);
  const target = dir > 0 ? frames.find(x => x > f) : [...frames].reverse().find(x => x < f);
  if (target != null) seekFrame(key, target);
  else toast(dir > 0 ? 'Nessun punto chiave dopo questo frame.' : 'Nessun punto chiave prima di questo frame.');
}
function pausePlayback(key) {
  const rt = rtOf(key), doc = docOf(key);

}
function togglePlay() {

  else { Editor.reqFrame[key] = null; Editor.draft = null; rt.play(Editor.speed); invalidate(); }
}
function setSpeed(s) {
  Editor.speed = s;
  for (const k of DOC_KEYS) { const rt = rtOf(k); if (rt.playing) rt.video.playbackRate = s; }
  updateTransportState(true);
}

/* ==========================================================================
   Penna temporanea (si dissolve) e scheda Confronto (due video sincronizzati).

class LivePen {
  constructor(container) {
    this.container = container;
    this.canvas = h('canvas', { class: 'pen-layer' });
    container.append(this.canvas);
    this.ctx = this.canvas.getContext('2d');
    this.strokes = [];
    this.active = false;
    this.raf = 0;
    this.dpr = 1;
    const c = this.canvas;
    let cur = null;
    const pt = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * this.dpr, (e.clientY - r.top) * this.dpr]; };
    c.addEventListener('pointerdown', e => {
      if (!this.active) return;
      try { c.setPointerCapture(e.pointerId); } catch { /* */ }
      cur = { pts: [pt(e)], done: false, end: 0, color: app.color === '#141517' ? C.yellow : app.color };
      this.strokes.push(cur);
      this.loop();
    });
    c.addEventListener('pointermove', e => { if (cur) { cur.pts.push(pt(e)); this.loop(); } });
    const up = () => { if (cur) { cur.done = true; cur.end = performance.now(); cur = null; this.loop(); } };
    c.addEventListener('pointerup', up);
    c.addEventListener('pointercancel', up);
    new ResizeObserver(() => this.resize()).observe(container);
    this.resize();
  }
  resize() {
    const r = this.container.getBoundingClientRect();
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.canvas.width = Math.max(1, Math.round(r.width * this.dpr));
    this.canvas.height = Math.max(1, Math.round(r.height * this.dpr));
    this.loop();
  }
  setActive(on) { this.active = on; this.canvas.classList.toggle('active', on); if (!on) { this.strokes = []; this.loop(); } }
  loop() { if (!this.raf) this.raf = requestAnimationFrame(() => this.draw()); }
  draw() {
    this.raf = 0;
    const { ctx, canvas } = this;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const now = performance.now();
    const HOLD = 1600, FADE = 700;
    this.strokes = this.strokes.filter(s => !s.done || now - s.end < HOLD + FADE);
    for (const s of this.strokes) {
      const a = s.done ? clamp(1 - (now - s.end - HOLD) / FADE, 0, 1) : 1;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.shadowColor = s.color;
      ctx.shadowBlur = 10 * this.dpr;
      smoothPath(ctx, s.pts);
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 6 * this.dpr;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.restore();
    }
    if (this.strokes.length) this.loop();
  }
}
function penButton(getPen) {
  const b = h('button', { class: 'btn', type: 'button', title: 'Penna temporanea: il tratto sparisce da solo', 'aria-pressed': 'false' }, icon('marker', 18), h('span', { class: 'lbl' }, 'Evidenzia'));
  b.addEventListener('click', () => {
    const pen = getPen();
    pen.setActive(!pen.active);
    b.classList.toggle('on', pen.active);
    b.setAttribute('aria-pressed', String(pen.active));
  });
  return b;
}

const Cmp = { canvas: null, ctx: null, dpr: 1, W: 0, H: 0, raf: 0, dirty: true, active: 'athlete', pen: null, els: {}, speed: 0.5, playing: false };

function cmpMapTime(tA) {
  const p = app.project, sync = p.compare.sync;
  const dC = docDuration(docOf('coach'));
  const t = sync ? sync.c + (tA - sync.a) : tA;
  return clamp(t, 0, Math.max(0, dC - 0.0005));
}
function cmpReady() { return rtOf('athlete').ready && rtOf('coach').ready && docOf('athlete').video && docOf('coach').video; }
function cmpLayout() {
  const { W, H } = Cmp;
  const side = W / H >= 1.15;
  const gap = 6 * Cmp.dpr;
  if (side) return { side, A: { x: 0, y: 0, w: (W - gap) / 2, h: H }, B: { x: (W + gap) / 2, y: 0, w: (W - gap) / 2, h: H } };
  return { side, A: { x: 0, y: 0, w: W, h: (H - gap) / 2 }, B: { x: 0, y: (H + gap) / 2, w: W, h: (H - gap) / 2 } };
}
function cmpInvalidate() { Cmp.dirty = true; if (!Cmp.raf) Cmp.raf = requestAnimationFrame(cmpTick); }
function cmpTick() {
  Cmp.raf = 0;
  if (app.tab !== 'compare') return;
  const A = rtOf('athlete'), B = rtOf('coach');
  const linked = app.project.compare.linked;
  if (linked && Cmp.playing) {
    if (A.playing) {
      const sync = app.project.compare.sync;
      const tA = A.video.currentTime;
      const raw = sync ? sync.c + (tA - sync.a) : tA;
      if (raw < 0) { if (B.playing) B.pause(); if (B.video.currentTime > 0.02) B.video.currentTime = 0; }
      else if (raw >= B.duration - 0.03) { if (B.playing) B.pause(); }
      else {
        const drift = B.video.currentTime - raw;
        if (!B.playing) { B.video.currentTime = raw; B.video.playbackRate = Cmp.speed; B.video.play().catch(() => {}); }
        else if (Math.abs(drift) > 0.15) B.video.currentTime = raw;
        else B.video.playbackRate = Cmp.speed * clamp(1 - drift * 2.5, 0.75, 1.25);
      }
    } else if (B.playing) B.pause();
  }
  const playing = A.playing || B.playing;
  if (Cmp.dirty || playing) { Cmp.dirty = false; cmpRender(); }
  if (playing) Cmp.raf = requestAnimationFrame(cmpTick);
  else if (Cmp.playing) { Cmp.playing = false; cmpUpdateTransport(true); }
}
function cmpRender() {
  const { ctx, W, H } = Cmp;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.well;
  ctx.fillRect(0, 0, W, H);
  if (!cmpReady()) return;
  const L = cmpLayout();
  const linked = app.project.compare.linked;
  for (const [key, box] of [['athlete', L.A], ['coach', L.B]]) {
    const doc = docOf(key), rt = rtOf(key);
    ctx.save();
    ctx.beginPath(); ctx.rect(box.x, box.y, box.w, box.h); ctx.clip();
    ctx.fillStyle = '#0d0e10'; ctx.fillRect(box.x, box.y, box.w, box.h);
    const pad = 4 * Cmp.dpr;
    const pl = cropPlacement(key, { x: box.x + pad, y: box.y + pad, w: box.w - 2 * pad, h: box.h - 2 * pad }, app.project.compare.crop !== false);
    ctx.save();
    ctx.beginPath(); ctx.rect(pl.D.x, pl.D.y, pl.D.w, pl.D.h); ctx.clip();
    const { kf } = drawScene(ctx, { doc, rt, rect: pl.rect });
    ctx.restore();
    const u = Math.min(box.w, box.h);
    const lbl = `${docLabel(key)}   ${fmtTime(rt.video.currentTime)}`;
    drawPill(ctx, lbl, box.x + 10 * Cmp.dpr, box.y + 22 * Cmp.dpr, u, { size: 0.042, align: 'left', min: 13 * Cmp.dpr, font: FONT_NUM });
    if (kf && !rt.playing) {
      const title = kfTitle(kf);
      drawPill(ctx, title, box.x + 10 * Cmp.dpr, box.y + 22 * Cmp.dpr + Math.max(13 * Cmp.dpr, u * 0.042) * 1.6, u, { size: 0.036, align: 'left', min: 12 * Cmp.dpr, bg: 'rgba(242,240,235,.92)', fg: C.rubber, font: FONT_NUM, weight: 700 });
    }
    if (!linked && Cmp.active === key) {
      ctx.strokeStyle = C.chalk; ctx.lineWidth = 3 * Cmp.dpr;
      ctx.strokeRect(box.x + 1.5 * Cmp.dpr, box.y + 1.5 * Cmp.dpr, box.w - 3 * Cmp.dpr, box.h - 3 * Cmp.dpr);
    }
    ctx.restore();
  }
  cmpUpdateTransport();
}
function cmpPhasePairs() {
  const A = docOf('athlete'), B = docOf('coach');
  return currentPhases().map(ph => ({ ph, a: A.keyframes.find(k => k.phaseId === ph.id), c: B.keyframes.find(k => k.phaseId === ph.id) })).filter(x => x.a || x.c);
}
async function cmpGoPhase(pair) {
  const A = rtOf('athlete'), B = rtOf('coach');
  A.pause(); B.pause();
  const p = app.project;
  const ta = pair.a ? pair.a.t : null, tc = pair.c ? pair.c.t : null;
  if (ta != null && tc != null) { p.compare.sync = { a: ta, c: tc }; p.compare.linked = true; }
  const jobs = [];
  if (ta != null) jobs.push(A.seekTo(ta));
  if (tc != null) jobs.push(B.seekTo(tc));
  else if (ta != null && p.compare.linked) jobs.push(B.seekTo(cmpMapTime(ta)));

  markDirty({ quiet: true });
  cmpBuildControls();
  cmpInvalidate();
}
function cmpCurrentPhaseIndex() {
  const pairs = cmpPhasePairs();
  const tA = rtOf('athlete').video.currentTime;
  let idx = -1;
  pairs.forEach((x, i) => { if (x.a && x.a.t <= tA + 0.0006) idx = i; });
  return { pairs, idx };
}
function cmpJumpPhase(dir) {
  const { pairs, idx } = cmpCurrentPhaseIndex();
  if (!pairs.length) { toast('Assegna le fasi ai punti chiave dei due video per confrontarli fase per fase.'); return; }
  const j = clamp(idx + dir, 0, pairs.length - 1);
  if (j === idx && idx >= 0) { toast(dir > 0 ? 'Sei all\'ultima fase.' : 'Sei alla prima fase.'); return; }
  cmpGoPhase(pairs[j < 0 ? 0 : j]);
}
async function cmpStep(delta) {
  const p = app.project;
  const A = rtOf('athlete'), B = rtOf('coach');
  A.pause(); B.pause();
  if (p.compare.linked) {
    const da = docOf('athlete');
    const fa = clamp(frameOf(da, A.video.currentTime) + delta, 0, frameCount(da) - 1);
    const ta = timeOfFrame(da, fa);
    const dc = docOf('coach');
    await Promise.all([A.seekTo(ta), B.seekTo(timeOfFrame(dc, frameOf(dc, cmpMapTime(ta))))]);
  } else {
    const key = Cmp.active, d = docOf(key), rt = rtOf(key);
    await rt.seekTo(timeOfFrame(d, frameOf(d, rt.video.currentTime) + delta));
  }
  cmpInvalidate();
}
async function cmpScrub(t) {
  const p = app.project;
  const A = rtOf('athlete'), B = rtOf('coach');
  A.pause(); B.pause();

    const da = docOf('athlete'), dc = docOf('coach');
    const ta = timeOfFrame(da, frameOf(da, t));

async function cmpTogglePlay() {
  const p = app.project;

  if (A.playing || B.playing) {
    A.pause(); B.pause();
    Cmp.playing = false;
    const da = docOf('athlete'), dc = docOf('coach');
    await Promise.all([A.seekTo(timeOfFrame(da, frameOf(da, A.video.currentTime))), B.seekTo(timeOfFrame(dc, frameOf(dc, B.video.currentTime)))]);

    Cmp.playing = true;

      await B.seekTo(cmpMapTime(A.video.currentTime));
      B.play(Cmp.speed);
      A.play(Cmp.speed);

  Cmp.H = Math.max(1, Math.round(r.height * Cmp.dpr));
  if (c.width !== Cmp.W || c.height !== Cmp.H) { c.width = Cmp.W; c.height = Cmp.H; }

/* ==========================================================================
   Diapositive: una per fase (frame atleta accanto al movimento corretto,
   punti con luci arbitrali, angoli), copertina e riepilogo. Esporta in PDF.
   Disegnate su canvas a 1600x900: identiche a schermo e nel PDF.
   ========================================================================== */

const SW = 1600, SH = 900;
const Slides = {
  list: [], idx: 0, canvas: null, ctx: null, pen: null, dpr: 1,
  imgCache: new Map(), queue: Promise.resolve(), thumbs: new Map(),
  live: null, raf: 0, renderToken: 0, els: {},
};

function buildSlideList() {
  const p = app.project;
  const A = docOf('athlete'), B = docOf('coach');
  const phases = currentPhases();
  const out = [];
  if (p.slides.cover) out.push({ key: 'cover', type: 'cover' });
  const usedA = new Set(), usedC = new Set();
  const byT = (x, y) => x.t - y.t;
  for (const ph of phases) {
    const as = A.keyframes.filter(k => k.phaseId === ph.id).sort(byT);
    const cs = B.keyframes.filter(k => k.phaseId === ph.id).sort(byT);
    if (!as.length && !cs.length) continue;
    const n = Math.max(as.length, cs.length);
    for (let i = 0; i < n; i++) {
      const a = as[i] || null, c = cs[i] || (as.length > cs.length ? cs[0] : null) || null;
      out.push({ key: `ph:${ph.id}:${i}`, type: 'phase', phase: ph, a, c });
      if (a) usedA.add(a.id);
      if (c) usedC.add(c.id);
    }
  }
  for (const k of [...A.keyframes].sort(byT)) if (!usedA.has(k.id)) out.push({ key: `kfa:${k.id}`, type: 'phase', phase: null, a: k, c: null });
  for (const k of [...B.keyframes].sort(byT)) if (!usedC.has(k.id)) out.push({ key: `kfc:${k.id}`, type: 'phase', phase: null, a: null, c: k });
  if (p.slides.summary) out.push({ key: 'summary', type: 'summary' });
  const order = p.slides.order;
  if (Array.isArray(order) && order.length) {
    const pos = new Map(order.map((k, i) => [k, i]));
    out.forEach((s, i) => { s._n = i; });
    out.sort((x, y) => {
      const px = pos.has(x.key) ? pos.get(x.key) : null, py = pos.has(y.key) ? pos.get(y.key) : null;
      if (px != null && py != null) return px - py;
      return x._n - y._n;
    });
  }
  for (const s of out) s.hidden = !!p.slides.hidden[s.key];
  return out;
}
function slideTitle(s) {
  if (s.type === 'cover') return 'Copertina';
  if (s.type === 'summary') return 'Riepilogo';
  if (s.phase) return s.phase.name;
  return kfTitle(s.a || s.c);
}

function kfImageKey(docKey, kf) {
  const d = docOf(docKey), rt = rtOf(docKey);
  return [docKey, kf.id, kf.rev || 0, kf.t, JSON.stringify(d.view), JSON.stringify(d.pose.angles), d.pose.set, d.pose.side,

function pdfText(str) {

function buildPdf(pages, { title = 'Moviola' } = {}) {

  const obj = (num, body) => { offsets[num] = offset; push(`${num} 0 obj\n`); body(); push('\nendobj\n'); };

  push(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));

  obj(2, () => push(`<< /Type /Pages /Kids [${pages.map((_, i) => `${4 + 3 * i} 0 R`).join(' ')}] /Count ${n} >>`));

  const ds = `D:${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}00`;
  obj(3, () => push(`<< /Title ${pdfText(title)} /Producer (Moviola) /Creator (Moviola) /CreationDate (${ds}) >>`));

    const pn = 4 + 3 * i, im = pn + 1, ct = pn + 2;
    obj(pn, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im${i} ${im} 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ${ct} 0 R >>`));

  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;

}

async function runVideoExport(source, o, { canvas, onProgress, signal }) {
  const fps = 30;
  const keyA = source === 'coach' ? 'coach' : 'athlete';
  const docA = docOf(keyA), rtA = rtOf(keyA);
  let W, H, side = true;
  if (source === 'compare') ({ W, H, side } = compareOutSize());

  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const enc = await createVideoEncoder(canvas, fps);
  for (const k of DOC_KEYS) rtOf(k).pause();
  const [from, to] = exportRange(keyA, o.range);
  const kfs = docA.keyframes.filter(k => k.t >= from - 1e-6 && k.t <= to + 1e-6 && (source !== 'compare' || k.phaseId)).sort((a, b) => a.t - b.t);

  for (const kf of kfs) {
    if (kf.t > cur) segs.push({ type: 'play', from: cur, to: kf.t });
    if (o.freeze && (kf.freeze ?? 3) > 0) segs.push({ type: 'freeze', kf, dur: kf.freeze ?? 3 });

  }
  if (to > cur) segs.push({ type: 'play', from: cur, to });

  const kfC = kf => kf?.phaseId ? docOf('coach').keyframes.find(k => k.phaseId === kf.phaseId) : null;

    for (const sg of segs) {
      const count = countOf(sg);
      if (sg.type === 'play') {
        let lastKey = '';
        for (let i = 0; i < count; i++) {
          if (signal.aborted) throw new DOMException('Interrotto', 'AbortError');
          const t = Math.min(sg.to, sg.from + (i / fps) * o.speed);
          const fA = frameOf(docA, t);
          if (source === 'compare') {
            const dC = docOf('coach');
            const fC = frameOf(dC, cmpMapTime(timeOfFrame(docA, fA)));
            const k = fA + ':' + fC;
            if (k !== lastKey) {
              await Promise.all([rtA.seekTo(timeOfFrame(docA, fA)), rtOf('coach').seekTo(timeOfFrame(dC, fC))]);
              drawExportCompare(ctx, W, H, side, null, null, o);
              lastKey = k;
            }
          } else if (String(fA) !== lastKey) {
            await rtA.seekTo(timeOfFrame(docA, fA));
            drawExportSingle(ctx, W, H, keyA, null, o);
            lastKey = String(fA);
          }
          await enc.add(n % (fps * 2) === 0);
          n++;

        }
      } else {
        if (source === 'compare') {
          const c = kfC(sg.kf);
          await Promise.all([rtA.seekTo(sg.kf.t), c ? rtOf('coach').seekTo(c.t) : rtOf('coach').seekTo(cmpMapTime(sg.kf.t))]);
          drawExportCompare(ctx, W, H, side, sg.kf, c, o);
        } else {
          await rtA.seekTo(sg.kf.t);
          drawExportSingle(ctx, W, H, keyA, sg.kf, o);
        }
        for (let i = 0; i < count; i++) {
          if (signal.aborted) throw new DOMException('Interrotto', 'AbortError');
          await enc.add(i === 0);

  } catch (e) {
    enc.cancel();
    throw e;
  }
}

/* ---------- Analisi salvate ---------- */
async function openProjects() {
  await saveProjectNow();
  let list = [];

  catch (e) { toast('Archivio non disponibile: ' + (e.message || e), { type: 'error' }); }
  const grid = h('div', { class: 'proj-grid' });
  let modal;
  for (const p of list) {
    const isCur = p.id === app.project.id;
    const tpl = findTemplate(p.liftId) || p.tpl;
    grid.append(h('div', { class: 'proj-card' + (isCur ? ' current' : '') },
      h('button', { class: 'proj-thumb', type: 'button', 'aria-label': `Apri ${p.name}`, style: p.thumb ? { backgroundImage: `url(${p.thumb})` } : null, onclick: () => { modal.close(); if (!isCur) openProject(p.id); } }),
      h('div', { class: 'proj-info' },
        h('span', { class: 'n' }, p.name || 'Analisi'),
        h('span', { class: 's' }, [tpl?.name, p.athlete].filter(Boolean).join(', ') || 'Senza atleta'),
        h('span', { class: 's' }, `Modificata il ${new Date(p.updatedAt || p.createdAt).toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' })}`)),
      h('div', { class: 'proj-actions' },
        isCur ? h('span', { class: 'small muted', style: { marginRight: 'auto', padding: '6px' } }, 'Aperta ora') : h('button', { class: 'btn small', type: 'button', onclick: () => { modal.close(); openProject(p.id); } }, 'Apri'),
        h('button', {
          class: 'icon-btn small', type: 'button', title: 'Esporta file', 'aria-label': 'Esporta file',
          onclick: async () => {
            const pg = progressCard(document.body, 'Preparo il file…');
            try { const blob = await exportProjectFile(p); deliverFile(blob, `${slug(p.name || p.athlete || 'analisi')}.moviola`, { title: 'File dell\'analisi pronto' }); }
            catch (e) { toast(e.message || String(e), { type: 'error' }); } finally { pg.close(); }
          },
        }, icon('download', 18)),
        h('button', {
          class: 'icon-btn small', type: 'button', title: 'Elimina', 'aria-label': 'Elimina',
          onclick: async () => {
            if (!(await confirmDialog(`Eliminare "${p.name}"? Video e disegni verranno cancellati da questo dispositivo.`, { title: 'Elimina analisi', ok: 'Elimina', danger: true }))) return;
            await dbDeleteProject(p.id);
            modal.close();
            if (isCur) await newProjectFlow(false);
            openProjects();
          },
        }, icon('trash', 18)))));
  }
  const body = h('div', { class: 'stack' },
    h('div', { class: 'row' },
      h('button', { class: 'btn primary', type: 'button', onclick: () => { modal.close(); newProjectFlow(); } }, icon('plus', 18), 'Nuova analisi'),
      h('button', { class: 'btn', type: 'button', onclick: () => { modal.close(); pickProjectFile(); } }, icon('upload', 18), 'Importa file .moviola')),
    list.length ? grid : h('p', { class: 'muted' }, 'Nessuna analisi salvata.'),
    h('p', { class: 'note-text' }, 'Le analisi restano su questo dispositivo. Per spostarle o tenerne una copia usa "Esporta file".'));
  modal = openModal({ title: 'Le mie analisi', body, wide: true });
}
function pickProjectFile() {
  const input = $('#file-project');
  input.value = '';
  input.onchange = async () => {
    const f = input.files?.[0];
    if (!f) return;
    const pg = progressCard(document.body, 'Importo l\'analisi…');
    try {
      await saveProjectNow();
      const p = await importProjectFile(f);
      await setProject(p);
      toast(`Analisi importata: ${p.name}`);
    } catch (e) { toast(e.message || 'Importazione non riuscita.', { type: 'error' }); }
    finally { pg.close(); }
  };
  input.click();
}
async function openProject(id) {
  await saveProjectNow();
  const p = await dbGet('projects', id);
  if (!p) { toast('Analisi non trovata.', { type: 'error' }); return; }
  await setProject(normalizeProject(p));
}
async function newProjectFlow(save = true) {
  if (save) await saveProjectNow();
  const p = newProject();
  if (app.project) { p.liftId = app.project.liftId; p.coach = app.project.coach; p.coachLabel = app.project.coachLabel; }
  p.tpl = stripTpl(findTemplate(p.liftId) || templates[0]);
  await setProject(p);
  await saveProjectNow();
  toast('Nuova analisi: carica il video dell\'atleta.');
}
async function setProject(p) {
  saveProjectSoon.cancel();
  if (currentView) {
    if (DOC_KEYS.includes(app.tab)) editorHide();
    else if (app.tab === 'compare') compareHide();
    else if (app.tab === 'slides') slidesHide();
    else if (app.tab.startsWith('link:')) linkHide();
    currentView = null;
  }
  for (const k of DOC_KEYS) rtOf(k).unload();
  linksReset();
  Slides.imgCache.clear(); Slides.thumbs.clear(); Slides.list = []; Slides.idx = 0;
  app.project = p;
  app.undo = []; app.redo = []; app.sel = null;
  if (!p.tpl) p.tpl = stripTpl(currentTemplate());
  emit('undo');
  updateProjectHeader();
  app.tab = 'athlete';
  setTab('athlete');
  try { localStorage.setItem('moviola.last', p.id); } catch { /* */ }
  for (const k of DOC_KEYS) {
    if (!p.docs[k].video) continue;
    restoreDocVideo(k).catch(e => toast(`Video "${docLabel(k)}": ${e.message || e}`, { type: 'error' }));
  }
}

/* ---------- Tastiera ---------- */
function onKey(e) {
  if (modalStack.length) return;
  const t = e.target;
  if (t && (['INPUT', 'TEXTAREA', 'SELECT'].includes(t.tagName) || t.isContentEditable)) return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (mod || e.altKey) return;
  if (e.key === 'Escape') { closeMenu(); if (app.presenting && !DOC_KEYS.includes(app.tab)) { setPresenting(false); $('#btn-present').classList.remove('on'); clear($('#btn-present')).append(icon('present', 19), h('span', { class: 'lbl' }, 'Presenta')); } }
  if (DOC_KEYS.includes(app.tab)) {
    switch (e.key) {
      case ' ': e.preventDefault(); togglePlay(); return;
      case 'ArrowLeft': e.preventDefault(); stepFrame(e.shiftKey ? -10 : -1); return;
      case 'ArrowRight': e.preventDefault(); stepFrame(e.shiftKey ? 10 : 1); return;
      case 'ArrowUp': e.preventDefault(); jumpKeyframe(-1); return;
      case 'ArrowDown': e.preventDefault(); jumpKeyframe(1); return;
      case 'Delete': case 'Backspace': if (deleteSelection()) e.preventDefault(); return;
      case 'Escape': Editor.draft = null; exitStageMode(); app.sel = null; updateStageHint(); invalidate(); return;
      case '0': resetZoom(); return;
      case 'k': case 'K': {
        const key = app.tab, doc = docOf(key);
        if (!rtOf(key).ready || kfAtFrame(doc, curFrame(key))) return;
        pushUndo();
        const kf = createKeyframe(key, curTime(key));
        openKfs.add(kf.id);
        markDirty({ structure: true });
        scheduleThumb(key, kf.id);
        if (app.panelTab === 'keys') renderPanel();
        toast('Punto chiave aggiunto.');
        return;
      }
    }
    const tool = TOOLS.find(x => x !== '-' && x.key === e.key.toLowerCase());
    if (tool) setTool(tool.id);
    return;
  }
  if (app.tab === 'compare') {
    if (e.key === ' ') { e.preventDefault(); cmpTogglePlay(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); cmpStep(e.shiftKey ? -10 : -1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); cmpStep(e.shiftKey ? 10 : 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); cmpJumpPhase(-1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); cmpJumpPhase(1); }
    return;
  }
  if (app.tab === 'slides') {
    if (['ArrowRight', 'PageDown', ' ', 'ArrowDown'].includes(e.key)) { e.preventDefault(); slideStep(1); }
    else if (['ArrowLeft', 'PageUp', 'ArrowUp'].includes(e.key)) { e.preventDefault(); slideStep(-1); }
  }
}

/* ---------- Avvio ---------- */
async function init() {
  loadTemplates();
  loadUiPrefs();
  for (const k of DOC_KEYS) app.rt[k] = new DocRuntime(k);
  editorInit();
  compareInit();
  slidesInit();
  linksInit();
  buildTopbar();
  document.addEventListener('keydown', onKey);
  on('change', o => {
    saveUiPrefs();
    if (o.quiet || !app.project) return;
    if (DOC_KEYS.includes(app.tab) && !o.quietPanel && (o.structure || o.bar || o.pose || o.video || o.lift || o.tpl || o.undo)) renderPanelSoon();
    if (o.structure || o.lift) renderTabs();
  });
  on('frame', () => { updatePanelCurrent(); });
  on('seeked', ({ key }) => { if (key === Editor.docKey && !rtOf(key)._seeking) updatePanelCurrent(); });
  on('thumbs', () => updatePanelThumbs());
  on('selection', () => updateToolrail());
  on('videoloading', ({ key, on: isOn }) => {
    if (!isOn && app.tab === key) editorShow(key);
    if (!isOn) renderTabs();
    if (!isOn && app.tab === 'compare') compareShow();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { for (const k of DOC_KEYS) rtOf(k).pause(); saveProjectSoon.flush(); saveProjectNow(); }
  });
  window.addEventListener('pagehide', () => { saveProjectSoon.flush(); });
  let project = null;
  try {
    await idbOpen();
    requestPersistence();
    const last = localStorage.getItem('moviola.last');
    if (last) { const p = await dbGet('projects', last); if (p) project = normalizeProject(p); }
  } catch (e) {
    console.error(e);
    toast('Archivio del browser non disponibile: le analisi non verranno salvate. Esci dalla navigazione privata.', { type: 'error' });
  }
  if (!project) { project = newProject(); project.tpl = stripTpl(findTemplate(project.liftId)); }
  await setProject(project);
  try { if (IS_IOS && !IS_STANDALONE && !localStorage.getItem('moviola.installHint')) setTimeout(openInstallHelp, 600); } catch { /* */ }
  try {
    await Promise.all(['500', '600', '700'].map(w => document.fonts.load(`${w} 20px "Barlow Condensed"`)));
    invalidate(); cmpInvalidate(); if (app.tab === 'slides') renderCurrentSlide();
  } catch { /* */ }
  if ('serviceWorker' in navigator && !window.MOVIOLA_NO_SW && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
  }
  window.moviola = { app, Editor, Cmp, Slides, Pose };
}
const renderPanelSoon = debounce(() => { if (DOC_KEYS.includes(app.tab)) renderPanel(); }, 60);

init().catch(e => { console.error(e); toast('Errore di avvio: ' + (e.message || e), { type: 'error' }); });

</script>
